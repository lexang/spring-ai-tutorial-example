spring.application.name=spring-ai-chat-memory
server.port=${SERVER_PORT:8080}

# 默认离线运行。设置 SPRING_AI_CHAT_MODEL=anthropic 后才创建 ChatModel。
spring.ai.model.chat=${SPRING_AI_CHAT_MODEL:none}
spring.ai.anthropic.api-key=${MINIMAX_API_KEY:}
spring.ai.anthropic.base-url=${MINIMAX_BASE_URL:https://api.minimax.io/anthropic}
spring.ai.anthropic.chat.model=${MINIMAX_MODEL:MiniMax-M3}

# 设置 SPRING_AI_EMBEDDING_MODEL=transformers 后才加载 ONNX 嵌入模型。
spring.ai.model.embedding=${SPRING_AI_EMBEDDING_MODEL:none}
spring.ai.embedding.transformer.tokenizer.uri=${EMBEDDING_TOKENIZER_URI:https://raw.githubusercontent.com/spring-projects/spring-ai/main/models/spring-ai-transformers/src/main/resources/onnx/all-MiniLM-L6-v2/tokenizer.json}
spring.ai.embedding.transformer.onnx.model-uri=${EMBEDDING_MODEL_URI:https://media.githubusercontent.com/media/spring-projects/spring-ai/refs/heads/main/models/spring-ai-transformers/src/main/resources/onnx/all-MiniLM-L6-v2/model.onnx}
spring.ai.embedding.transformer.cache.enabled=true
spring.ai.embedding.transformer.tokenizer.options.padding=true
spring.ai.embedding.transformer.cache.directory=${EMBEDDING_CACHE_DIRECTORY:${java.io.tmpdir}/spring-ai-onnx-model}

# 文件型 H2 默认跨应用重启保留数据；测试会覆盖为独立的内存数据库。
spring.datasource.url=${CHAT_MEMORY_JDBC_URL:jdbc:h2:file:./data/chat-memory;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${CHAT_MEMORY_DB_USERNAME:sa}
spring.datasource.password=${CHAT_MEMORY_DB_PASSWORD:}

# embedded 只为 H2、HSQLDB、Derby 等嵌入式数据库初始化表结构。
spring.ai.chat.memory.repository.jdbc.initialize-schema=embedded

# 控制台默认关闭，避免在非本地环境暴露数据库访问入口。
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

logging.level.root=INFO
logging.level.com.example.springai=INFO
logging.level.org.springframework.ai=INFO

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
