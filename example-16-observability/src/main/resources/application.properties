spring.application.name=spring-ai-observability
server.port=${SERVER_PORT:8080}
server.address=${SERVER_ADDRESS:127.0.0.1}

# Actuator 暴露指标和 Prometheus 端点；默认不暴露提示词、回答和向量正文。
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never

# Spring AI 2.0 观察日志属性。只有明确开启时才会输出可能包含敏感信息的正文。
spring.ai.chat.client.observations.log-prompt=${SPRING_AI_LOG_CHAT_CLIENT_PROMPT:false}
spring.ai.chat.client.observations.log-completion=${SPRING_AI_LOG_CHAT_CLIENT_COMPLETION:false}
spring.ai.chat.observations.log-prompt=${SPRING_AI_LOG_CHAT_PROMPT:false}
spring.ai.chat.observations.log-completion=${SPRING_AI_LOG_CHAT_COMPLETION:false}
spring.ai.chat.observations.include-error-logging=${SPRING_AI_LOG_CHAT_ERRORS:false}
spring.ai.tools.observations.include-content=false
spring.ai.vectorstore.observations.log-query-response=false

logging.level.root=INFO
logging.level.com.example.springai=INFO
logging.level.org.springframework.ai=INFO
