# Reader、Splitter 和文件 Writer 不需要大模型。只有元数据增强端点需要显式启用 ChatModel。
spring.ai.model.chat=${SPRING_AI_CHAT_MODEL:none}

# Spring AI 2.0 已移除 MiniMax 专用模块；启用 anthropic 后通过兼容接口调用。
spring.ai.anthropic.api-key=${MINIMAX_API_KEY:}
spring.ai.anthropic.base-url=${MINIMAX_BASE_URL:https://api.minimax.io/anthropic}
spring.ai.anthropic.chat.model=${MINIMAX_MODEL:MiniMax-M3}

# VectorStore 流程使用 Transformers ONNX 嵌入模型。URI 可改成已下载模型的 file: URI。
spring.ai.model.embedding=${SPRING_AI_EMBEDDING_MODEL:none}
spring.ai.embedding.transformer.tokenizer.uri=${EMBEDDING_TOKENIZER_URI:https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/raw/main/tokenizer.json}
spring.ai.embedding.transformer.onnx.model-uri=${EMBEDDING_MODEL_URI:https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/main/onnx/model.onnx}
spring.ai.embedding.transformer.cache.enabled=true
spring.ai.embedding.transformer.tokenizer.options.padding=true
spring.ai.embedding.transformer.cache.directory=${EMBEDDING_CACHE_DIRECTORY:${java.io.tmpdir}/spring-ai-onnx-model}

# 应用配置
server.port=${SERVER_PORT:8080}
spring.application.name=spring-ai-etl-pipeline

# FileDocumentWriter 只写入服务端预先配置的目录，不接受请求传入任意路径。
app.etl.output-directory=${ETL_OUTPUT_DIRECTORY:${java.io.tmpdir}/spring-ai-etl-output}

# 日志配置
logging.level.com.example.springai=INFO
logging.level.org.springframework.ai=INFO

# 文件上传配置
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
