# 默认离线启动。只有显式设置 SPRING_AI_CHAT_MODEL=anthropic 时才创建 ChatModel。
spring.ai.model.chat=${SPRING_AI_CHAT_MODEL:none}

# 通过 Anthropic 兼容接口访问 MiniMax；密钥只从环境变量读取。
spring.ai.anthropic.api-key=${MINIMAX_API_KEY:}
spring.ai.anthropic.base-url=${MINIMAX_BASE_URL:https://api.minimax.io/anthropic}
spring.ai.anthropic.chat.model=${MINIMAX_MODEL:MiniMax-M3}
spring.ai.anthropic.chat.temperature=${MINIMAX_TEMPERATURE:0.7}

spring.application.name=advisors-deep-dive-example
server.port=${SERVER_PORT:8080}
logging.level.root=INFO
logging.level.com.example.springai=INFO
logging.level.org.springframework.ai=INFO
