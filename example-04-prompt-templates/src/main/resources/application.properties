# Spring AI 2.0 通过 Anthropic 兼容接口访问 MiniMax；密钥只从环境变量注入
spring.ai.anthropic.api-key=${MINIMAX_API_KEY}
spring.ai.anthropic.base-url=${MINIMAX_BASE_URL:https://api.minimax.io/anthropic}
spring.ai.anthropic.chat.model=${MINIMAX_MODEL:MiniMax-M3}
spring.ai.anthropic.timeout=${MINIMAX_TIMEOUT:60s}
spring.ai.anthropic.max-retries=${MINIMAX_MAX_RETRIES:2}

server.port=8080
spring.application.name=prompt-templates

logging.level.com.example.springai=INFO
