# 与 Maven -Ppgvector 同时启用；只对专门准备的教学数据库初始化 schema。
app.vector-store.type=pgvector
spring.ai.vectorstore.type=pgvector
spring.autoconfigure.exclude=
spring.datasource.url=${PGVECTOR_JDBC_URL:jdbc:postgresql://localhost:5432/spring_ai_tutorial}
spring.datasource.username=${PGVECTOR_USERNAME:postgres}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=${EMBEDDING_DIMENSIONS:384}
spring.ai.vectorstore.pgvector.initialize-schema=${PGVECTOR_INITIALIZE_SCHEMA:false}
spring.ai.vectorstore.pgvector.remove-existing-vector-store-table=false
spring.ai.vectorstore.pgvector.schema-validation=true
spring.ai.vectorstore.pgvector.table-name=tutorial_vector_store
