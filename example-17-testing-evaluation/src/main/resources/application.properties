spring.application.name=spring-ai-testing-evaluation
server.port=${SERVER_PORT:8080}

# 默认关闭供应商模型自动配置，使用离线确定性 Judge，不读取任何 API Key。
spring.ai.model.chat=none
spring.ai.model.embedding=none
app.evaluation.offline=true
spring.ai.anthropic.api-key=${MINIMAX_API_KEY:}
spring.ai.anthropic.base-url=${MINIMAX_BASE_URL:https://api.minimax.io/anthropic}
spring.ai.anthropic.chat.model=${MINIMAX_MODEL:MiniMax-M3}
server.address=${SERVER_ADDRESS:127.0.0.1}
logging.level.com.example.springai=INFO
