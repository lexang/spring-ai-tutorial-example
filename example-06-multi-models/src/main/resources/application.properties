# 多供应商场景显式创建 ChatModel，避免 spring.ai.model.chat 单选自动配置只创建一个模型
spring.ai.model.chat=none
# OpenAI starter 还包含 Image/Embedding/Audio/Moderation 自动配置；本示例只演示 ChatModel。
spring.ai.model.embedding=none
spring.ai.model.embedding.text=none
spring.ai.model.embedding.multimodal=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none

app.models.openai.api-key=${OPENAI_API_KEY:}
app.models.openai.model=${OPENAI_CHAT_MODEL:gpt-4o-mini}

# Spring AI 2.0 通过 Anthropic 兼容接口访问 MiniMax
app.models.minimax.api-key=${MINIMAX_API_KEY:}
app.models.minimax.base-url=${MINIMAX_BASE_URL:https://api.minimax.io/anthropic}
app.models.minimax.model=${MINIMAX_MODEL:MiniMax-M3}

# 保留 ChatClient.Builder 自动配置：同一 OpenAI 模型的四个客户端复用 prototype Builder，
# MiniMax 客户端则通过 ChatClientBuilderConfigurer 保留可观测性和 Builder Customizer。
spring.ai.chat.client.enabled=true

# 日志配置
logging.level.com.example.springai=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# 应用配置
server.port=8080
spring.application.name=multi-models-example
