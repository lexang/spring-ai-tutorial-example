spring.application.name=content-studio-example
server.port=${SERVER_PORT:8080}
server.address=127.0.0.1
app.ai.mode=${APP_AI_MODE:offline}
spring.ai.model.chat=none
spring.ai.model.image=none
spring.ai.model.embedding=none
spring.ai.model.moderation=none
spring.ai.model.audio.transcription=none
spring.ai.model.audio.speech=none
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com}
spring.ai.openai.chat.model=${OPENAI_CHAT_MODEL:gpt-4o-mini}
spring.ai.openai.image.model=${OPENAI_IMAGE_MODEL:gpt-image-1-mini}
spring.ai.openai.audio.speech.model=${OPENAI_SPEECH_MODEL:gpt-4o-mini-tts}
spring.ai.openai.audio.speech.response-format=wav
