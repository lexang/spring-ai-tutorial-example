# OpenAI API 配置
spring.ai.openai.api-key=${OPENAI_API_KEY}
# OpenAI Chat 模型配置
spring.ai.openai.chat.model=${OPENAI_CHAT_MODEL:gpt-4o-mini}
# OpenAI Embedding 模型配置
spring.ai.openai.embedding.model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}

# 本篇只使用聊天与向量化，关闭不相关模型。
spring.ai.model.image=none
spring.ai.model.audio.transcription=none
spring.ai.model.audio.speech=none
spring.ai.model.moderation=none


# 应用配置
server.port=8080
spring.application.name=spring-ai-core-concepts

# 日志配置
logging.level.com.example.springai=INFO
logging.level.org.springframework.ai=INFO
spring.ai.chat.observations.log-prompt=false
spring.ai.chat.observations.log-completion=false
