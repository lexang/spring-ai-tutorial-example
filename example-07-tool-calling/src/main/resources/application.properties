# Spring AI 2.0 通过 Anthropic 兼容接口访问 MiniMax
spring.ai.anthropic.api-key=${MINIMAX_API_KEY:}
spring.ai.anthropic.base-url=${ANTHROPIC_BASE_URL:https://api.minimax.io/anthropic}
spring.ai.anthropic.chat.model=${ANTHROPIC_CHAT_MODEL:MiniMax-M3}
# 服务端预算，不允许模型或请求正文自行提高
tutorial.tools.max-model-calls=${TOOL_MAX_MODEL_CALLS:6}
spring.ai.tools.limits.max-calls-per-tool-default=3
spring.ai.tools.limits.max-total-tool-calls=6
spring.ai.tools.resolution.fallback.enabled=false
# 应用配置
spring.application.name=tool-calling
server.port=8080

# 日志配置
logging.level.com.example.springai=INFO
# 排查时再临时开启 DEBUG，并注意参数、结果和供应商正文泄漏风险
logging.level.org.springframework.ai=INFO
