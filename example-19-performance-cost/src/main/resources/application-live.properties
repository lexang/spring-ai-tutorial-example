# 仅使用环境变量注入凭据；不要把真实密钥提交到仓库。
spring.ai.model.chat=openai
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com}
spring.ai.openai.chat.model=${OPENAI_CHAT_MODEL:gpt-4o-mini}

# OpenAI 2.0.2 使用官方 SDK 的传输与重试配置。
spring.ai.openai.timeout=${OPENAI_TIMEOUT:60s}
spring.ai.openai.max-retries=${OPENAI_MAX_RETRIES:2}
