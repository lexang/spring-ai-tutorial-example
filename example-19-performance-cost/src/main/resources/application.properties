spring.application.name=spring-ai-performance-cost
server.port=${SERVER_PORT:8090}
server.address=127.0.0.1

# 默认完全离线。只有显式启用 live profile 才创建 OpenAI ChatModel。
spring.ai.model.chat=none
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.transcription=none
spring.ai.model.audio.speech=none
spring.ai.model.moderation=none

# 价格只是本地演示用的占位单价，必须按实际供应商账单覆盖。
demo.cost.input-per-million=${DEMO_INPUT_COST_PER_MILLION:1.00}
demo.cost.output-per-million=${DEMO_OUTPUT_COST_PER_MILLION:2.00}
demo.cost.cache-read-per-million=${DEMO_CACHE_READ_COST_PER_MILLION:0.50}
demo.cost.cache-write-per-million=${DEMO_CACHE_WRITE_COST_PER_MILLION:1.00}
demo.cost.prompt-tokens-include-cache=${DEMO_PROMPT_TOKENS_INCLUDE_CACHE:true}

# Spring AI 官方观察性默认不记录提示词和完成正文，避免泄露敏感信息。
spring.ai.chat.observations.log-prompt=false
spring.ai.chat.observations.log-completion=false
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never
