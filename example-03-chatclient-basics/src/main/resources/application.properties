
# OpenAI API 配置
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.model=${OPENAI_CHAT_MODEL:gpt-4o-mini}
spring.ai.openai.timeout=${OPENAI_TIMEOUT:30s}

# OpenAI 流式 Usage 默认关闭；需要额外 usage 数据块时设置 OPENAI_STREAM_USAGE=true
spring.ai.openai.chat.stream-usage=${OPENAI_STREAM_USAGE:false}

# 2.0.2 OpenAI 适配器使用官方 SDK/OkHttp，重试由 SDK 配置。
spring.ai.openai.max-retries=${OPENAI_MAX_RETRIES:2}
# 本项目只调用聊天模型，关闭同一 starter 中其他模型自动配置。
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.transcription=none
spring.ai.model.audio.speech=none
spring.ai.model.moderation=none

# 应用配置
server.port=8080
spring.application.name=chatclient-basics

# 日志配置
logging.level.com.example.springai=INFO

# 默认不输出 Prompt 和 Completion；仅在本地调试且确认无敏感数据时改为 DEBUG
logging.level.org.springframework.ai.chat.client.advisor=INFO
