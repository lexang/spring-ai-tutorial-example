spring.application.name=personal-knowledge-example
server.port=${SERVER_PORT:8080}
server.address=127.0.0.1

app.ai.mode=${APP_AI_MODE:offline}
spring.ai.model.chat=none
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.moderation=none
spring.ai.model.audio.transcription=none
spring.ai.model.audio.speech=none
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com}
spring.ai.openai.chat.model=${OPENAI_CHAT_MODEL:gpt-4o-mini}
spring.ai.openai.chat.temperature=0.0
spring.ai.openai.embedding.model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}

spring.datasource.url=jdbc:h2:mem:personal_knowledge;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=${KNOWLEDGE_DB_USER:sa}
spring.datasource.password=${KNOWLEDGE_DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5
spring.sql.init.mode=always
spring.h2.console.enabled=false
