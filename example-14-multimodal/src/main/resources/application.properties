# 默认关闭四类模型，保证没有密钥时也可以启动和执行离线测试。
spring.ai.model.chat=${SPRING_AI_CHAT_MODEL:none}
spring.ai.model.image=${SPRING_AI_IMAGE_MODEL:none}
spring.ai.model.audio.transcription=${SPRING_AI_TRANSCRIPTION_MODEL:none}
spring.ai.model.audio.speech=${SPRING_AI_SPEECH_MODEL:none}
spring.ai.model.embedding=none
spring.ai.model.moderation=none

# 凭据只从环境变量读取；不要把真实密钥写入仓库。
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com}
# 2026-11-07 官方标记 gpt-4o-mini 为 Deprecated；此值仅作已有配置复现，调用前选择可用模型。
spring.ai.openai.chat.model=${OPENAI_CHAT_MODEL:gpt-4o-mini}
spring.ai.openai.image.model=${OPENAI_IMAGE_MODEL:gpt-image-1-mini}
spring.ai.openai.audio.transcription.model=${OPENAI_TRANSCRIPTION_MODEL:gpt-transcribe}
spring.ai.openai.audio.transcription.response-format=json
# 这些 Speech API 模型计划于 2027-01-06 停用；Realtime 不是直接替换 model 的相同工作流。
spring.ai.openai.audio.speech.model=${OPENAI_SPEECH_MODEL:gpt-4o-mini-tts}
spring.ai.openai.audio.speech.voice=${OPENAI_SPEECH_VOICE:alloy}
spring.ai.openai.audio.speech.response-format=${OPENAI_SPEECH_FORMAT:mp3}
spring.ai.openai.audio.speech.speed=${OPENAI_SPEECH_SPEED:1.0}

spring.application.name=multimodal-example
server.port=${SERVER_PORT:8080}
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_SIZE:12MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:12MB}
logging.level.root=INFO
logging.level.com.example.springai=INFO
